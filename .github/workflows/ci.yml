name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify server entry
        run: node --check server/index.js

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install dependencies
        run: |
          npm ci
          pip install -r tests/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # Starts the Vite dev server itself, then runs every tests/*_browser.py.
      - name: Run browser tests
        run: npm run test:browser

      - name: Upload Vite log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vite-browser-tests-log
          path: node_modules/.vite-browser-tests.log
          if-no-files-found: ignore
