<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f23">
  <meta name="description" content="專業繁體中文寶可夢圖鑑">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <title>寶可夢圖鑑</title>
</head>
<body>
  <div class="app-container">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar">
      <div class="logo">
        <div class="logo-icon">🔮</div>
        <div class="logo-text">寶可夢圖鑑</div>
      </div>

      <div class="filter-section">
        <div class="filter-title">搜尋</div>
        <input type="text" class="search-box" id="searchBox" placeholder="輸入寶可夢名稱或編號...">
      </div>

      <div class="filter-section">
        <div class="filter-title">篩選</div>
        <div class="filter-group">
          <button type="button" class="filter-btn" id="favoritesFilter">★ 我的收藏</button>
        </div>
      </div>

      <div class="sidebar-drawer is-open" data-drawer="gen">
        <button type="button" class="sidebar-drawer-toggle" aria-expanded="true" aria-controls="genDrawerBody">
          <span>世代</span>
          <span class="drawer-chevron" aria-hidden="true">▼</span>
        </button>
        <div class="sidebar-drawer-body" id="genDrawerBody">
          <div class="filter-group" id="genFilters">
            <button type="button" class="filter-btn active" data-gen="all">所有世代</button>
            <button type="button" class="filter-btn" data-gen="1">第 1 世代</button>
            <button type="button" class="filter-btn" data-gen="2">第 2 世代</button>
            <button type="button" class="filter-btn" data-gen="3">第 3 世代</button>
            <button type="button" class="filter-btn" data-gen="4">第 4 世代</button>
            <button type="button" class="filter-btn" data-gen="5">第 5 世代</button>
            <button type="button" class="filter-btn" data-gen="6">第 6 世代</button>
            <button type="button" class="filter-btn" data-gen="7">第 7 世代</button>
            <button type="button" class="filter-btn" data-gen="8">第 8 世代</button>
            <button type="button" class="filter-btn" data-gen="9">第 9 世代</button>
          </div>
        </div>
      </div>

      <div class="sidebar-drawer" data-drawer="version">
        <button type="button" class="sidebar-drawer-toggle" aria-expanded="false" aria-controls="versionDrawerBody">
          <span>版本</span>
          <span class="drawer-chevron" aria-hidden="true">▼</span>
        </button>
        <div class="sidebar-drawer-body" id="versionDrawerBody" hidden>
          <div id="versionDrawerRoot" class="version-drawer-root"></div>
        </div>
      </div>

      <div class="sidebar-drawer is-open" data-drawer="type">
        <button type="button" class="sidebar-drawer-toggle" aria-expanded="true" aria-controls="typeDrawerBody">
          <span>屬性</span>
          <span class="drawer-chevron" aria-hidden="true">▼</span>
        </button>
        <div class="sidebar-drawer-body" id="typeDrawerBody">
          <div class="type-filters-wrap">
            <button type="button" class="type-btn type-btn--all active" id="typeFilterAll" data-type="all">全部</button>
            <div class="type-filters" id="typeFilters"></div>
          </div>
        </div>
      </div>

      <div class="sidebar-drawer" data-drawer="advanced">
        <button type="button" class="sidebar-drawer-toggle" aria-expanded="false" aria-controls="advancedDrawerBody">
          <span>進階篩選 <span class="adv-count" id="advCount" hidden></span></span>
          <span class="drawer-chevron" aria-hidden="true">▼</span>
        </button>
        <div class="sidebar-drawer-body" id="advancedDrawerBody" hidden>
          <div class="adv-filters" id="advancedFilters">
            <label class="adv-field">
              <span class="adv-label">第二屬性（雙屬性）</span>
              <select id="advType2" class="adv-input"><option value="all">不限</option></select>
              <small class="adv-hint">與上方屬性一起選，可找出「火＋飛行」等組合</small>
            </label>
            <fieldset class="adv-field">
              <legend class="adv-label">種族值範圍</legend>
              <select id="advStat" class="adv-input" aria-label="比較的種族值"></select>
              <div class="adv-range">
                <input type="number" id="advMin" class="adv-input" min="0" max="999" inputmode="numeric" placeholder="最低" aria-label="最低值">
                <span aria-hidden="true">–</span>
                <input type="number" id="advMax" class="adv-input" min="0" max="999" inputmode="numeric" placeholder="最高" aria-label="最高值">
              </div>
            </fieldset>
            <label class="adv-field">
              <span class="adv-label">特性（含隱藏特性）</span>
              <input type="search" id="advAbility" class="adv-input" list="advAbilityList" placeholder="例如：飄浮、威嚇" autocomplete="off">
              <datalist id="advAbilityList"></datalist>
              <small class="adv-hint" id="advAbilityHint" aria-live="polite"></small>
            </label>
            <label class="adv-field">
              <span class="adv-label">蛋群</span>
              <select id="advEgg" class="adv-input"><option value="">不限</option></select>
            </label>
            <button type="button" class="adv-reset" id="advReset">重設進階篩選</button>
          </div>
        </div>
      </div>

      <div class="filter-section sidebar-catalog-section">
        <div class="filter-title">延伸圖鑑</div>
        <div class="sidebar-catalog-list">
          <a href="./items.html" class="sidebar-catalog-link sidebar-catalog-link--items">
            <span class="sidebar-catalog-icon" aria-hidden="true">🎒</span>
            <span class="sidebar-catalog-text">
              <span class="sidebar-catalog-label">道具圖鑑</span>
              <span class="sidebar-catalog-desc">依世代瀏覽道具</span>
            </span>
            <span class="sidebar-catalog-arrow" aria-hidden="true">→</span>
            <span class="sidebar-catalog-tip" role="tooltip">依世代瀏覽所有道具；點卡片可篩選持有該道具的寶可夢</span>
          </a>
          <a href="./machines.html" class="sidebar-catalog-link sidebar-catalog-link--machines">
            <span class="sidebar-catalog-icon" aria-hidden="true">💿</span>
            <span class="sidebar-catalog-text">
              <span class="sidebar-catalog-label">招式機</span>
              <span class="sidebar-catalog-desc">依世代瀏覽招式機</span>
            </span>
            <span class="sidebar-catalog-arrow" aria-hidden="true">→</span>
            <span class="sidebar-catalog-tip" role="tooltip">依世代瀏覽招式學習器、秘傳機器與招式記錄；點卡片可篩選能學該招式的寶可夢</span>
          </a>
          <a href="./moves.html" class="sidebar-catalog-link sidebar-catalog-link--moves">
            <span class="sidebar-catalog-icon" aria-hidden="true">📖</span>
            <span class="sidebar-catalog-text">
              <span class="sidebar-catalog-label">招式與特性</span>
              <span class="sidebar-catalog-desc">查數值與學習者</span>
            </span>
            <span class="sidebar-catalog-arrow" aria-hidden="true">→</span>
            <span class="sidebar-catalog-tip" role="tooltip">搜尋全部招式與特性，查看威力、命中、說明，以及能學會或擁有的寶可夢</span>
          </a>
          <a href="./team.html" class="sidebar-catalog-link sidebar-catalog-link--team">
            <span class="sidebar-catalog-icon" aria-hidden="true">🛡️</span>
            <span class="sidebar-catalog-text">
              <span class="sidebar-catalog-label">隊伍分析</span>
              <span class="sidebar-catalog-desc">找出共同弱點</span>
            </span>
            <span class="sidebar-catalog-arrow" aria-hidden="true">→</span>
            <span class="sidebar-catalog-tip" role="tooltip">選最多 6 隻寶可夢，分析共同弱點、本系招式打擊面與補強方向</span>
          </a>
        </div>
      </div>

      <div class="sidebar-footer">
        <button type="button" class="clear-cache-btn" id="clearCacheBtn">清除快取</button>
      </div>
    </aside>

    <main class="main-content">
      <header class="header">
        <button type="button" class="menu-btn" id="menuBtn" aria-label="開啟選單">☰</button>
        <div class="stats-info">
          <div class="stat-card" id="statCard">
            <div class="stat-tags" id="statTags" hidden></div>
            <div class="stat-value" id="statCount">0</div>
            <div class="stat-label" id="statLabel">圖鑑</div>
          </div>
        </div>
        <div class="header-controls">
          <select class="sort-select" id="sortSelect" aria-label="排序">
            <optgroup label="基本">
              <option value="id">排序：編號</option>
              <option value="name">排序：名稱</option>
              <option value="generation">排序：世代</option>
            </optgroup>
            <optgroup label="種族值">
              <option value="total">排序：種族值總和</option>
              <option value="hp">排序：HP</option>
              <option value="attack">排序：攻擊</option>
              <option value="defense">排序：防禦</option>
              <option value="special-attack">排序：特攻</option>
              <option value="special-defense">排序：特防</option>
              <option value="speed">排序：速度</option>
            </optgroup>
            <optgroup label="其他">
              <option value="height">排序：身高（高→低）</option>
              <option value="weight">排序：體重（重→輕）</option>
              <option value="capture_rate">排序：捕獲率（難→易）</option>
            </optgroup>
          </select>
          <select class="sort-select forms-select" id="formsSelect" aria-label="顯示形態">
            <option value="none">形態：不顯示</option>
            <option value="all">形態：全部</option>
            <option value="mega">形態：超級進化</option>
            <option value="regional">形態：地區形態</option>
            <option value="gmax">形態：超極巨化</option>
            <option value="other">形態：其他</option>
          </select>
          <div class="view-controls">
            <button type="button" class="view-btn" data-view="grid">網格</button>
            <button type="button" class="view-btn" data-view="list">列表</button>
          </div>
        </div>
      </header>

      <div id="loadingContainer" class="loading-container">
        <div class="loader"></div>
        <div class="progress-container">
          <div class="progress-bar" id="progressBar" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progressText">載入中... 0%</div>
      </div>

      <div class="pokemon-grid" id="pokemonGrid"></div>

      <div class="load-more-container" id="loadMoreContainer" style="display: none;">
        <button type="button" class="load-more-btn" id="loadMoreBtn">載入更多寶可夢</button>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close-btn" id="closeModalBtn" aria-label="關閉">×</button>
        <div class="modal-header-content" id="modalHeader"></div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="cache-toast" id="cacheToast" role="alert"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
