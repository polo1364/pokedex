<!DOCTYPE html>

<head>

  <script>

    try { if (localStorage.getItem('pokedex_guide_theme') === 'light') document.documentElement.classList.add('guide-light'); } catch (e) {}

</head>
<body class="guide-page-body">

          <select id="guideVersionSelect" class="guide-version-select" aria-label="選擇版本"></select>

  <button type="button" id="guideBackToTop" class="guide-back-to-top back-to-top" aria-label="返回上方" hidden>↑</button>

  <script type="module" src="/src/guide-main.js"></script>
