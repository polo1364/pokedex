<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f23">
  <meta name="description" content="招式與特性圖鑑：搜尋全部招式與特性，查看威力、命中、說明與可學會／擁有的寶可夢">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <title>招式與特性圖鑑｜寶可夢圖鑑</title>
</head>
<body class="move-catalog-body">
  <div class="items-page move-catalog-page">
    <header class="items-page-header">
      <div class="items-page-header-top">
        <a href="./index.html" class="guide-back-link">← 返回圖鑑</a>
      </div>
      <h1 class="items-page-title">招式與特性圖鑑</h1>
      <p class="items-page-subtitle">搜尋全部招式與特性，查看數值、說明，以及能學會或擁有的寶可夢</p>
      <details class="catalog-notes">
        <summary>資料說明</summary>
        <p>招式數值與說明採 PokéAPI 最新資料；不同世代的威力、命中可能曾經調整。說明文字取最新一筆繁中版本，沒有繁中時保留英文。</p>
        <p>「可學會的寶可夢」包含升級、招式機、教學與蛋招式等所有方式，以一般形態為準；形態只列出數量。招式機在各版本的編號請見招式機圖鑑。</p>
        <p>來源：<a href="https://pokeapi.co/docs/v2#moves" target="_blank" rel="noopener noreferrer">PokéAPI</a>。</p>
      </details>

      <div class="mc-tabs" role="tablist" aria-label="切換圖鑑">
        <button type="button" role="tab" class="mc-tab" id="mcTabMoves" data-tab="moves" aria-controls="mcList" aria-selected="true">招式 <span class="mc-tab-count" id="mcMovesCount"></span></button>
        <button type="button" role="tab" class="mc-tab" id="mcTabAbilities" data-tab="abilities" aria-controls="mcList" aria-selected="false">特性 <span class="mc-tab-count" id="mcAbilitiesCount"></span></button>
      </div>

      <div class="mc-toolbar">
        <input type="search" class="search-box mc-search" id="mcSearch" placeholder="搜尋名稱（繁中或英文）或編號…" autocomplete="off" aria-label="搜尋">
        <div class="mc-filters">
          <label class="mc-filter mc-moves-only"><span>屬性</span><select id="mcType"><option value="all">全部</option></select></label>
          <label class="mc-filter mc-moves-only"><span>分類</span><select id="mcClass"><option value="all">全部</option></select></label>
          <label class="mc-filter"><span>世代</span><select id="mcGen"><option value="all">全部</option></select></label>
          <label class="mc-filter"><span>排序</span><select id="mcSort"></select></label>
        </div>
        <p class="items-count" id="mcCount" aria-live="polite"></p>
      </div>
    </header>

    <main class="items-page-main">
      <div id="mcList" class="mc-list" role="tabpanel" aria-labelledby="mcTabMoves">
        <p class="mc-empty">載入資料中…</p>
      </div>
    </main>
  </div>

  <script type="module" src="/src/moves-main.js"></script>
  <button type="button" id="mcBackToTop" class="back-to-top" aria-label="返回上方" hidden>↑</button>
</body>
</html>
